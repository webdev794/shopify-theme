name: Shopify Lighthouse CI

on:
  push:
    branches:
      - submit2d
      - backup-v2
      - main
      - master
  pull_request:
    branches:
      - submit2d
      - backup-v2
      - main
      - master

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push theme
        run: |
          shopify theme push \
            --theme=156530344114 \
            --path=. \
            --store=suvara-beauty.myshopify.com \
            --allow-live \
            --force
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}

      - name: Check if store is password-protected
        id: auth
        run: |
          set -e

          # First, see if the homepage is freely accessible
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://suvara-beauty.myshopify.com/")
          echo "Homepage HTTP status: $HOME_CODE"

          if [ "$HOME_CODE" = "200" ]; then
            echo "Store is public — no password cookie needed"
            echo "cookie=" >> "$GITHUB_OUTPUT"
            echo "protected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Store appears password-protected (status $HOME_CODE). Trying password form..."

          HTTP_CODE=$(curl -c cookies.txt -b cookies.txt -L -s -o /dev/null -w "%{http_code}" \
            -X POST "https://suvara-beauty.myshopify.com/password" \
            --data-urlencode "form_type=storefront_password" \
            --data-urlencode "utf8=✓" \
            --data-urlencode "password=${{ secrets.STORE_PASSWORD }}")

          echo "Password form HTTP status: $HTTP_CODE"
          echo "=== cookies.txt ==="
          cat cookies.txt || true

          COOKIE=$(grep -E 'storefront_digest' cookies.txt 2>/dev/null | awk '{print $6"="$7}' | tr '\n' '; ' | sed 's/; $//')
          echo "Extracted cookie: $COOKIE"

          if [ -z "$COOKIE" ]; then
            echo "::warning::Could not get storefront_digest cookie. Continuing without auth (may hit password page)."
            echo "cookie=" >> "$GITHUB_OUTPUT"
            echo "protected=true" >> "$GITHUB_OUTPUT"
          else
            echo "cookie=$COOKIE" >> "$GITHUB_OUTPUT"
            echo "protected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Lighthouse config
        run: |
          COOKIE='${{ steps.auth.outputs.cookie }}'

          if [ -n "$COOKIE" ]; then
            EXTRA_HEADERS="\"extraHeaders\": {\"Cookie\": \"$COOKIE\"},"
          else
            EXTRA_HEADERS=""
          fi

          cat > lighthouserc.json << EOF
          {
            "ci": {
              "collect": {
                "numberOfRuns": 3,
                "url": [
                  "https://suvara-beauty.myshopify.com/?preview_theme_id=156530344114"
                ],
                "settings": {
                  "preset": "desktop",
                  "chromeFlags": "--no-sandbox --disable-dev-shm-usage",
                  $EXTRA_HEADERS
                  "onlyCategories": ["performance", "accessibility", "best-practices", "seo"]
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.5}],
                  "categories:accessibility": ["error", {"minScore": 0.9}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF

          # Clean possible trailing comma if no extraHeaders
          sed -i 's/,\n[[:space:]]*}/}/' lighthouserc.json || true

          echo "=== lighthouserc.json ==="
          cat lighthouserc.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Show results
        if: always()
        run: |
          echo "=== .lighthouseci contents ==="
          ls -la .lighthouseci/ || echo "No .lighthouseci directory"

          echo ""
          echo "=== links.json ==="
          cat .lighthouseci/links.json 2>/dev/null || echo "No links.json"

          echo ""
          echo "=== Scores ==="
          for report in .lighthouseci/lhr-*.json .lighthouseci/*-lighthouse-results.json; do
            [ -f "$report" ] || continue
            echo "--- $report ---"
            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (r.categories) {
                console.log("Performance:   ", Math.round(r.categories.performance.score * 100));
                console.log("Accessibility: ", Math.round(r.categories.accessibility.score * 100));
                console.log("Best Practices:", Math.round(r.categories["best-practices"].score * 100));
                console.log("SEO:           ", Math.round(r.categories.seo.score * 100));
              } else {
                console.log("No categories found in", process.argv[1]);
              }
            ' "$report"
          done