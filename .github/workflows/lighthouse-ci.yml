name: Shopify Lighthouse CI
on: [push, pull_request]

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push theme to existing CI theme
        run: shopify theme push --theme=156530344114 --path=. --store=suvara-beauty.myshopify.com --allow-live --force
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ secrets.PREVIEW_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Show live report link
        run: |
          echo "Live Lighthouse report(s):"
          cat .lighthouseci/links.json 2>/dev/null || echo "No links.json found"

      - name: Print Lighthouse scores
        run: |
          for report in .lighthouseci/*.json; do
            echo "=== $report ==="
            node -e "
              const r = require('./' + '$report');
              if (r.categories) {
                console.log('Performance:', Math.round(r.categories.performance.score * 100));
                console.log('Accessibility:', Math.round(r.categories.accessibility.score * 100));
                console.log('Best Practices:', Math.round(r.categories['best-practices'].score * 100));
                console.log('SEO:', Math.round(r.categories.seo.score * 100));
              }
            "
          done
