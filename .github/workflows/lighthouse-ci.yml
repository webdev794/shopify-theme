name: Shopify Lighthouse CI

on:
  push:
    branches:
      - backup-v2
  pull_request:
    branches:
      - backup-v2

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push theme and capture preview URL
        id: push
        run: |
          OUTPUT=$(shopify theme push --theme=156530344114 --path=. --store=suvara-beauty.myshopify.com --allow-live --force --json)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | node -pe "JSON.parse(require('fs').readFileSync(0)).theme.preview_url")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.push.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Show live report link
        run: |
          echo "Live Lighthouse report(s):"
          cat .lighthouseci/links.json 2>/dev/null || echo "No links.json found"

      - name: Print Lighthouse scores
        run: |
          for report in .lighthouseci/*.json; do
            echo "=== $report ==="
            node -e "
              const r = require('./' + '$report');
              if (r.categories) {
                console.log('Performance:', Math.round(r.categories.performance.score * 100));
                console.log('Accessibility:', Math.round(r.categories.accessibility.score * 100));
                console.log('Best Practices:', Math.round(r.categories['best-practices'].score * 100));
                console.log('SEO:', Math.round(r.categories.seo.score * 100));
              }
            "
          done